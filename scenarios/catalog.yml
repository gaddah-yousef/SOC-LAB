      - The destination is hard-coded to the internal web-target service.
      - The simulator only joins the internal target-segment Docker network.

  - id: LAB-ENDPOINT-002
    slug: persistence-artifact
    name: Creation of a monitored startup artifact
    technique: T1546
    tactic: Persistence
    expected_rules: [554, 100130]
    evidence:
      - runtime/telemetry/endpoint/fim/lab-update.conf
      - runtime/evidence/LAB-ENDPOINT-002-*.json
    safety_controls:
      - Creates a harmless text fixture only inside the ignored runtime directory.
