---
scenarios:
  - id: LAB-ENDPOINT-001
    slug: ssh-bruteforce
    name: Repeated SSH authentication failures
    technique: T1110.001
    tactic: Credential Access
    expected_rules: [5710, 100100, 100150]
    evidence:
      - runtime/telemetry/endpoint/auth.log
      - runtime/evidence/LAB-ENDPOINT-001-*.json
    safety_controls:
      - Writes deterministic synthetic log lines; it opens no network connection.
      - Uses the fixed documentation address 198.51.100.23.

  - id: LAB-NETWORK-001
    slug: web-recon
    name: Web service discovery against the lab target
    technique: T1595.002
    tactic: Reconnaissance
    expected_rules: [900001, 900002, 100110, 100120, 100140]
    evidence:
      - runtime/telemetry/suricata/eve.json
      - runtime/telemetry/zeek/http.log
      - runtime/evidence/LAB-NETWORK-001-*.json
