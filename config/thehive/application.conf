include "/etc/thehive/secret.conf"

db.janusgraph.storage {
  backend = cql
  hostname = ["thehive-cassandra"]
  cql {
    cluster-name = enterprise-soc-cases
    keyspace = thehive
  }
}

include "/etc/thehive/index.conf"

storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}

stream.longPolling.refresh = 45 seconds
play.http.context = "/"
play.http.parser.maxDiskBuffer = 1GB
play.http.parser.maxMemoryBuffer = 256kB

# Connectors remain disabled by default. Cortex's official container workflow
# mounts the Docker socket, which violates this lab's trust boundary.
