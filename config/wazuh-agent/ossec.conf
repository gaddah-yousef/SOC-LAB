<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux,container,enterprise-soc-lab</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>30</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <port>1515</port>
      <agent_name>finance-workstation-01</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>simulated-linux</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes">/var/log/lab/fim</directories>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lab/auth.log</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/lab/application.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
