name: Quality and security policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Render local-only configuration
        run: make bootstrap

      - name: Enforce repository policy
        run: make validate

      - name: Run unit and contract tests
        run: make test

      - name: Compile Python entrypoints
        run: python -m compileall -q scripts tests

      - name: Validate all Compose profiles
        run: COMPOSE_PROFILES=core,network,attack,cases,intel docker compose config --quiet

      - name: Check installed Python dependency consistency
        run: python -m pip check
