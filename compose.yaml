name: enterprise-soc-lab

services:
  cert-generator:
    image: wazuh/wazuh-certs-generator:0.0.5
    profiles: [bootstrap]
    hostname: wazuh-certs-generator
    network_mode: none
    environment:
      CERT_TOOL_VERSION: "4.14"
      CERT_TOOL_REPOSITORY: prod
    volumes:
      - ./runtime/certs:/certificates
      - ./config/wazuh/certs.yml:/config/certs.yml:ro

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.10
    profiles: [core]
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./runtime/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./runtime/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./runtime/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./runtime/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./runtime/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh-indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./runtime/config/wazuh-indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      soc-control:
        aliases: [wazuh.indexer]
    healthcheck:
      test: [CMD-SHELL, "curl --silent --insecure https://localhost:9200 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.10
    profiles: [core]
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?run make bootstrap}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?run make bootstrap}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - 127.0.0.1:1514:1514
      - 127.0.0.1:1515:1515
      - 127.0.0.1:55000:55000
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./runtime/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./runtime/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./runtime/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh-manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./detections/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./config/wazuh-manager/lists/lab-malicious-ips:/var/ossec/etc/lists/lab-malicious-ips:ro
      - ./runtime/config/wazuh-agent/authd.pass:/var/ossec/etc/authd.pass:ro
      - ./runtime/telemetry/suricata:/var/log/suricata:ro
      - ./runtime/telemetry/zeek:/var/log/zeek:ro
    networks:
      soc-control:
        aliases: [wazuh.manager]
    healthcheck:
      test: [CMD-SHELL, "/var/ossec/bin/wazuh-control status >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.10
    profiles: [core]
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?run make bootstrap}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?run make bootstrap}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?run make bootstrap}
    ports:
      - 127.0.0.1:8443:5601
    volumes:
      - ./runtime/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./runtime/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./runtime/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh-dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      soc-control:
        aliases: [wazuh.dashboard]

  linux-endpoint:
    image: wazuh/wazuh-agent:4.14.10
    profiles: [core]
    hostname: finance-workstation-01
    restart: unless-stopped
    depends_on:
      wazuh-manager:
        condition: service_healthy
    environment:
      WAZUH_MANAGER_SERVER: wazuh.manager
    volumes:
      - ./config/wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./runtime/config/wazuh-agent/authd.pass:/var/ossec/etc/authd.pass:ro
      - ./runtime/telemetry/endpoint:/var/log/lab:ro
    networks:
      - soc-control

  web-target:
    image: bkimminich/juice-shop:v20.3.0
    profiles: [core, network]
    hostname: customer-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - 127.0.0.1:3000:3000
    networks:
      target-segment:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true

  suricata:
    image: jasonish/suricata:8.0.8
    profiles: [network]
    network_mode: service:web-target
    restart: unless-stopped
    depends_on:
      web-target:
        condition: service_started
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=32m,noexec,nosuid,nodev
      - /tmp:size=64m,noexec,nosuid,nodev
    command: [-i, eth0, -c, /etc/suricata/suricata.yaml]
    volumes:
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./detections/suricata/lab.rules:/etc/suricata/rules/lab.rules:ro
      - ./runtime/telemetry/suricata:/var/log/suricata

  zeek:
    image: zeek/zeek:9.0.1
    profiles: [network]
    network_mode: service:web-target
    restart: unless-stopped
    depends_on:
      web-target:
        condition: service_started
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt:
      - no-new-privileges:true
    read_only: true
    working_dir: /logs
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    command: [zeek, -i, eth0, local, LogAscii::use_json=T]
    volumes:
      - ./runtime/telemetry/zeek:/logs

  attack-simulator:
    image: curlimages/curl:8.23.0
    profiles: [attack]
    depends_on:
      web-target:
        condition: service_started
    networks:
      - target-segment
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    command: [--version]

  thehive-cassandra:
    image: cassandra:4.1.12
    profiles: [cases]
    hostname: thehive-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: enterprise-soc-cases
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_NUM_TOKENS: "4"
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    mem_limit: 2g
    volumes:
      - thehive-cassandra-data:/var/lib/cassandra
    networks:
      - case-segment
    healthcheck:
      test: [CMD-SHELL, "cqlsh -u cassandra -p cassandra -e 'describe keyspaces' >/dev/null"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 12

  thehive-elasticsearch:
    image: elasticsearch:8.19.23
    profiles: [cases]
    hostname: thehive-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: enterprise-soc-cases
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${CASE_INDEX_PASSWORD:?run make bootstrap}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - thehive-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - case-segment
    healthcheck:
      test: [CMD-SHELL, "curl --silent http://localhost:9200 >/dev/null"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12

  thehive:
    image: strangebee/thehive:6.0.0
    profiles: [cases]
    hostname: thehive
    restart: unless-stopped
    command: [--no-config, --no-config-secret]
    environment:
      JAVA_OPTS: >-
        -Xms1280M -Xmx1280M -XX:MaxMetaspaceSize=400m
        -XX:ReservedCodeCacheSize=250m
    mem_limit: 2g
    depends_on:
      thehive-cassandra:
        condition: service_healthy
      thehive-elasticsearch:
        condition: service_healthy
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - ./config/thehive/application.conf:/etc/thehive/application.conf:ro
      - ./runtime/config/thehive/index.conf:/etc/thehive/index.conf:ro
      - ./runtime/config/thehive/secret.conf:/etc/thehive/secret.conf:ro
      - thehive-files:/opt/thp/thehive/files
      - thehive-logs:/var/log/thehive
    networks:
      - case-segment
    healthcheck:
      test: [CMD-SHELL, "curl --silent --fail http://localhost:9000/thehive/api/status >/dev/null"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 12

  threat-intel-feed:
    image: nginxinc/nginx-unprivileged:1.29.5-alpine
    profiles: [intel]
    hostname: threat-intel-feed
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
    volumes:
      - ./intel/misp-feed:/usr/share/nginx/html:ro
    networks:
      - soc-control

networks:
  soc-control:
    name: enterprise-soc-control
    internal: true
  target-segment:
    name: enterprise-soc-target
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  case-segment:
    name: enterprise-soc-cases
    internal: true

volumes:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  thehive-cassandra-data:
  thehive-elasticsearch-data:
  thehive-files:
  thehive-logs:
